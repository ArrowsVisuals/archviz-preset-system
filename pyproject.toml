[project]
name = "archviz-preset-system"
description = "Curated preset library for high-end architectural visualization with Nano Banana Pro / Gemini 3 Pro Image. Three nodes: (AV) Preset, (AV) Matrix, (AV) Assembler."
version = "4.1.0"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Repository = "https://github.com/ArrowsVisuals/archviz-preset-system"
Issues = "https://github.com/ArrowsVisuals/archviz-preset-system/issues"
Changelog = "https://github.com/ArrowsVisuals/archviz-preset-system/blob/main/CHANGELOG.md"

[tool.comfy]
PublisherId = "arrowsvisuals"
DisplayName = "ArchViz Preset System"
Icon = ""
includes = ["presets", "workflows"]

[project]
name = "archviz-preset-system"
description = "Model-aware preset library for high-end architectural visualization. One preset stack, compiled to the native dialect of Nano Banana, Flux 2, GPT Image 2, or Ideogram 4. Three nodes: (AV) Preset, (AV) Matrix, (AV) Assembler."
version = "5.2.7"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Repository = "https://github.com/ArrowsVisuals/archviz-preset-system"
Issues = "https://github.com/ArrowsVisuals/archviz-preset-system/issues"
Changelog = "https://github.com/ArrowsVisuals/archviz-preset-system/blob/main/CHANGELOG.md"

[tool.comfy]
PublisherId = "arrowsvisuals"
DisplayName = "ArchViz Preset System"
Icon = ""
includes = ["presets", "workflows", "scene_data"]

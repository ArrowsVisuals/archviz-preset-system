name: Bug report
description: Report a problem with the ArchViz Preset System
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How to reproduce
      description: Steps to trigger the bug. A workflow JSON helps.
    validations:
      required: true
  - type: input
    attributes:
      label: ComfyUI version
      placeholder: "e.g. 0.20.1, frontend 1.43.17"
    validations:
      required: true
  - type: input
    attributes:
      label: ArchViz version
      placeholder: "e.g. 3.0.0"
    validations:
      required: true
  - type: textarea
    attributes:
      label: Console output
      description: Paste the full error traceback and the `[ArchViz]` startup lines.
      render: shell
  - type: textarea
    attributes:
      label: archviz_presets.json
      description: Are you using the default presets or have you customized them?
